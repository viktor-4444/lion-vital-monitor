<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="description" content="Monitor táctico biomédico de Lion. Simulación autónoma para cosplay.">
<meta name="application-name" content="LION VITAL MONITOR">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Monitor</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#dfe8e2;overflow:hidden;font-family:Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:grid;grid-template-rows:9vh 1fr;grid-template-columns:67% 33%}
header{grid-column:1/3;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 1.6vw;border-bottom:1px solid #1a2620;font-size:3.6vh;color:#86998d;letter-spacing:.05em;white-space:nowrap}
header .der{text-align:right}
#enlace{color:#ffd21f;margin-right:1.6vw;font-size:2.8vh}
 #audioBtn{
  background:#15251b;
  color:#19ff6a;
  border:1px solid #31543c;
  border-radius:5px;
  padding:.7vh 1.5vw;
  margin-right:1.5vw;
  font-size:2.5vh;
  font-weight:700;
  letter-spacing:.08em;
}
#audioBtn.muted{
  color:#ffd21f;
  border-color:#806b24;
  background:#29230e;
}
#alarma{padding:.5vh 2.4vw;border-radius:.5vh;font-weight:700;letter-spacing:.14em;font-size:3.8vh;visibility:hidden}
#alarma.alta{visibility:visible;background:#ff1e3c;color:#fff;animation:destello 1s steps(1) infinite}
#alarma.media{visibility:visible;background:#ffd21f;color:#1a1400}
#alarma.info{visibility:visible;background:#000;color:#ffd21f;box-shadow:inset 0 0 0 2px #ffd21f}
@keyframes destello{50%{background:#4a000d;color:#ff8a9c}}
#ondas{position:relative;border-right:1px solid #1a2620}
#cv{position:absolute;top:0;left:0;width:100%;height:100%}
.etq{position:absolute;left:1.2vw;font-size:3vh;font-weight:700;letter-spacing:.08em}
.etq small{font-weight:400;opacity:.65;margin-left:1vw}
#nums{display:grid;grid-template-rows:37fr 24fr 21fr 18fr}
.t{position:relative;border-bottom:1px solid #1a2620;overflow:hidden}
.t:last-child{border-bottom:0}
.lbl{position:absolute;left:1.4vw;top:1vh;font-size:3.1vh;font-weight:700;letter-spacing:.06em}
.lbl small{font-weight:400;opacity:.7;margin-left:.5vw;font-size:2.5vh}
.lim{position:absolute;left:1.4vw;bottom:1.4vh;font-size:2.3vh;line-height:1.3;opacity:.6}
.val{position:absolute;right:1.6vw;bottom:-.4vh;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hr{color:#19ff6a}.hr .val{font-size:25vh}
.hr.alto{color:#ff2a3d}
.sp{color:#2bd9ff}.sp .val{font-size:16vh}
.pa{color:#ff6f8c}.pa .val{font-size:9.5vh;bottom:3.2vh}
.pa .map{position:absolute;right:1.6vw;bottom:.6vh;font-size:3vh;opacity:.85}
.rs{color:#ffd21f}.rs .val{font-size:11vh}
.rs .tmp{position:absolute;left:1.4vw;bottom:1.2vh;font-size:3vh;color:#dfe8e2}
.rs .tmp b{font-size:4vh}
#cor{position:absolute;right:1.6vw;top:1.1vh;width:4.6vh;height:4.6vh;fill:currentColor;opacity:.18;transition:opacity .3s}
#cor.on{opacity:1;transition:none}
#fuente{position:absolute;right:8vh;top:1.6vh;font-size:2.3vh;opacity:.6;letter-spacing:.1em}
#flash{position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;opacity:0;pointer-events:none;z-index:4;transition:opacity .35s}
#flash.on{opacity:1;transition:none}
#inicio{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;color:#19ff6a;text-align:center}
#inicio b{font-size:6vh;letter-spacing:.2em;animation:respira 2s ease-in-out infinite}
#inicio span{margin-top:3vh;font-size:3vh;color:#86998d;letter-spacing:.08em}
@keyframes respira{50%{opacity:.35}}
</style></head><body>
<div id="app">
 <header>
  <div id="pac"></div>
  <div id="alarma">ALARMA</div>
  <div class="der">
  <button id="audioBtn" type="button" aria-pressed="true">🔊 AUDIO</button>
  <span id="enlace"></span>
  <span id="reloj">--:--:--</span>
</div>
 </header>
 <div id="ondas">
  <canvas id="cv"></canvas>
  <div class="etq" style="top:1.2%;color:#19ff6a">II<small>x1  25 mm/s</small></div>
  <div class="etq" style="top:47.5%;color:#2bd9ff">PLETH</div>
  <div class="etq" style="top:75.5%;color:#ffd21f">RESP</div>
 </div>
 <div id="nums">
  <div class="t hr" id="thr">
   <div class="lbl">HR<small>lpm</small></div>
   <span id="fuente"></span>
   <svg id="cor" viewBox="0 0 24 24"><path d="M12 21s-7.6-4.7-9.7-9.3C.8 8.3 3 4 7 4c2.2 0 3.6 1.2 5 3 1.4-1.8 2.8-3 5-3 4 0 6.2 4.3 4.7 7.7C19.6 16.3 12 21 12 21z"/></svg>
   <div class="lim">120<br>50</div>
   <div class="val" id="hrv">--</div>
  </div>
  <div class="t sp">
   <div class="lbl">SpO<sub>2</sub><small>%</small></div>
   <div class="lim">100<br>90</div>
   <div class="val" id="spv">--</div>
  </div>
  <div class="t pa">
   <div class="lbl">NIBP<small>mmHg</small></div>
   <div class="lim" id="pah">--:--</div>
   <div class="val" id="pav">---/--</div>
   <div class="map" id="pam">(--)</div>
  </div>
  <div class="t rs">
   <div class="lbl">RESP<small>rpm</small></div>
   <div class="tmp">T <b id="tmv">36.8</b> °C</div>
   <div class="val" id="rsv">--</div>
  </div>
 </div>
</div>
<div id="flash"></div>
<div id="inicio"><b>TOCA PARA INICIAR</b><span id="estadoEnlace">Buscando monitor...</span></div>
<script>
var PACIENTE = 'CAMA 07  ·  ADULTO';      // texto de la esquina superior izquierda
var T_CARGA = 1100, PITIDO_PLANO = 3500;

var $ = function (s) { return document.getElementById(s); };
$('pac').textContent = PACIENTE;

// ---------------- estado que llega de la ESP32 ----------------
var st = { bpm: 76, modo: 'normal', real: 0, susto: 0, mf: 1 };
var enlace = false, tUltMsg = -1e9, tModo = 0;
var latidos = [];                       // [{t, ivl}] últimos latidos (tiempo del teléfono)

function nuevoLatido(t, ivl) {
  latidos.push({ t: t, ivl: ivl });
  if (latidos.length > 4) latidos.shift();
  var c = $('cor'); c.classList.add('on'); setTimeout(function () { c.classList.remove('on'); }, 110);
  if (st.modo === 'normal') tono(640 + (spo2 - 85) * 22, 0.07, 'sine', 0.22);   // el tono sube con la SpO2, como los reales
}

function cambioModo(m) {
  st.modo = m; tModo = performance.now(); latidos = [];
  pararTonos();
  if (m === 'plano') sonarTono(980, PITIDO_PLANO / 1000, 'sine', 0.22);
  if (m === 'reviviendo') sonidoCarga();
}

var ws = null;
function conectar() {
  // La PWA se sirve por HTTPS y funciona de forma autónoma.
  // Los navegadores bloquean ws:// desde páginas HTTPS (contenido mixto).
  // La versión servida directamente por la ESP32 usa HTTP y sí conecta.
  if (location.protocol === 'https:') { enlace = false; return; }
  try { ws = new WebSocket('ws://' + (location.hostname || '192.168.4.1') + ':81/'); }
  catch (e) { setTimeout(conectar, 1000); return; }
  ws.onopen = function () { enlace = true; };
  ws.onmessage = function (e) {
    var m; try { m = JSON.parse(e.data); } catch (x) { return; }
    tUltMsg = performance.now(); enlace = true;
    if (m.t === 'b') { st.bpm = m.bpm; if (st.modo === 'normal') nuevoLatido(performance.now(), m.ivl); }
    else if (m.t === 's') {
      st.bpm = m.bpm; st.real = m.real; st.susto = m.susto; st.mf = m.mf;
      if (m.modo !== st.modo) cambioModo(m.modo);
    }
  };
  ws.onclose = function () { enlace = false; setTimeout(conectar, 1000); };
  ws.onerror = function () { try { ws.close(); } catch (x) {} };
}
conectar();

// Si se pierde la conexión, la página sigue latiendo sola
function simLocal(now) {
  if (enlace && now - tUltMsg < 3000) return;
  if (st.modo === 'reviviendo' && now - tModo > T_CARGA + 600) cambioModo('normal');
  if (st.modo !== 'normal') return;
  var u = latidos.length ? latidos[latidos.length - 1] : null;
  if (!u || now - u.t >= u.ivl) nuevoLatido(now, 60000 / Math.max(st.bpm, 30) * (1 + (Math.random() - 0.5) * 0.05));
}

// ---------------- sonido (Web Audio) ----------------
var ac = null, masterGain = null, tonosActivos = [];

var audioEnabled = true;

try {
  audioEnabled = localStorage.getItem('lionAudio') !== 'off';
} catch(e) {}

function actualizarAudio() {
  var b = $('audioBtn');
  if (!b) return;

  b.textContent = audioEnabled ? '🔊 AUDIO' : '🔇 MUTE';
  b.classList.toggle('muted', !audioEnabled);
  b.setAttribute('aria-pressed', String(audioEnabled));
  b.title = audioEnabled ? 'Silenciar alarmas' : 'Activar sonido';
}

function cambiarAudio() {
  audioEnabled = !audioEnabled;

  try {
    localStorage.setItem('lionAudio', audioEnabled ? 'on' : 'off');
  } catch(e) {}

  if (masterGain && ac) {
    masterGain.gain.setTargetAtTime(
      audioEnabled ? 1 : 0,
      ac.currentTime,
      0.015
    );
  }

  actualizarAudio();
}

$('audioBtn').addEventListener('click', cambiarAudio);
actualizarAudio();
function tono(f, dur, tipo, vol, retraso) {
  if (!ac) return null;
  var t = ac.currentTime + (retraso || 0), o = ac.createOscillator(), g = ac.createGain();
  o.type = tipo || 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.008);
  g.gain.setValueAtTime(vol || 0.2, t + Math.max(dur - 0.02, 0.01));
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g);
g.connect(masterGain || ac.destination);
  o.start(t); o.stop(t + dur + 0.03);
  return o;
}
function sonarTono(f, dur, tipo, vol) { var o = tono(f, dur, tipo, vol); if (o) tonosActivos.push(o); }
function pararTonos() { tonosActivos.forEach(function (o) { try { o.stop(); } catch (e) {} }); tonosActivos = []; }
function sonidoCarga() {
  if (!ac) return;
  var t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(400, t);
  o.frequency.exponentialRampToValueAtTime(2800, t + T_CARGA / 1000);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(0.07, t + 0.1);
  g.gain.setValueAtTime(0.07, t + T_CARGA / 1000 - 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t + T_CARGA / 1000);
  o.connect(g);
g.connect(masterGain || ac.destination);
o.start(t);
o.stop(t + T_CARGA / 1000 + 0.05);
  tonosActivos.push(o);
}
function alarmaMedia() { for (var i = 0; i < 3; i++) tono(660, 0.13, 'square', 0.06, i * 0.22); }

// ---------------- signos vitales simulados ----------------
var spo2 = 98, rr = 15, temp = 36.8, faseResp = 0, ampResp = 1, ampPleth = 1;
var pa = null, tProxPA = 0, tDescarga = -1e9, alarmaTaqui = 0, descargaHecha = false;
function hhmm(d) { return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2); }
function medirPA() {
  var s = st.susto || 0;
  var sis = Math.round(114 + Math.random() * 8 + 34 * s), dia = Math.round(72 + Math.random() * 6 + 16 * s);
  pa = { s: sis, d: dia, m: Math.round(dia + (sis - dia) / 3), h: hhmm(new Date()) };
}
function vitales(dt, now) {
  var s = st.susto || 0, normal = st.modo === 'normal';
  var objSp = 98.4 - 2.6 * s;
  spo2 += (objSp - spo2) * Math.min(1, dt / 4) + (Math.random() - 0.5) * 0.04;
  rr += ((15 + 11 * s) - rr) * Math.min(1, dt / 3);
  temp += (36.8 - temp) * 0.01 + (Math.random() - 0.5) * 0.002;
  ampResp += ((normal ? 1 : 0) - ampResp) * Math.min(1, dt / (normal ? 1 : 2.5));
  ampPleth += ((normal ? 1 - 0.35 * s : 0) - ampPleth) * Math.min(1, dt / 0.6);
  faseResp += dt * rr / 60 * 2 * Math.PI;
  if (now > tProxPA) { medirPA(); tProxPA = now + 300000; }
  if (st.modo === 'reviviendo' && !descargaHecha && now - tModo >= T_CARGA) {
    descargaHecha = true; tDescarga = now;
    var f = $('flash'); f.classList.add('on'); setTimeout(function () { f.classList.remove('on'); }, 120);
    tono(80, 0.22, 'square', 0.35); tono(55, 0.3, 'sine', 0.4);
  }
  if (st.modo !== 'reviviendo') descargaHecha = false;
  if (now - tDescarga > 15000 && now - tDescarga < 15100) tProxPA = now;   // presión tras la descarga
  if (normal && st.bpm >= 120) { if (now - alarmaTaqui > 8000) { alarmaTaqui = now; alarmaMedia(); } }
  else alarmaTaqui = 0;
}

// ---------------- formas de onda ----------------
function g(s, m, w, a) { var d = (s - m) / w; return a * Math.exp(-0.5 * d * d); }
function ruido(a) { return (Math.random() - 0.5) * a; }
function valECG(t) {
  var v = ruido(0.02) + 0.02 * Math.sin(t * 0.0019);
  if (st.modo === 'plano') return v * 0.6;
  if (st.modo === 'reviviendo') {
    var d = t - tModo;
    var k = d - T_CARGA;                       // artefacto de la descarga: se sale de escala y regresa
    if (k >= 0 && k < 35) return 2;
    if (k >= 35 && k < 70) return -2;
    if (k >= 70) return v - 0.9 * Math.exp(-(k - 70) / 120);
    return v;
  }
  for (var i = 0; i < latidos.length; i++) {
    var L = latidos[i], s = (t - L.t) / 1000, I = L.ivl / 1000;
    if (s < -0.05 || s > 2.2) continue;
    var tT = 0.16 + 0.12 * I, tP = I - 0.13;
    v += g(s, 0, 0.009, -0.12) + g(s, 0.022, 0.010, 1) + g(s, 0.046, 0.011, -0.28) + g(s, tT, 0.04 + 0.02 * I, 0.3);
    if (tP > tT + 0.08) v += g(s, tP, 0.024, 0.12);
  }
  return v;
}
function valPleth(t) {
  var v = 0;
  for (var i = 0; i < latidos.length; i++) {
    var s = (t - latidos[i].t) / 1000;
    if (s < 0 || s > 1.6) continue;
    v += g(s, 0.20, 0.065, 1) + g(s, 0.43, 0.09, 0.32);
  }
  return v * ampPleth + ruido(0.012);
}
var ahora = 0;
function valResp(t) {
  var f = faseResp - (ahora - t) / 1000 * rr / 60 * 2 * Math.PI;
  return Math.sin(f) * ampResp + ruido(0.015);
}

// ---------------- dibujo con barrido ----------------
var cv = $('cv'), cx = cv.getContext('2d'), dpr = 1, CW = 0, CH = 0, bandas = [];
var DEF = [
  { h: 0.46, seg: 5,  col: '#19ff6a', f: valECG,   base: 0.64, amp: 0.46 },
  { h: 0.29, seg: 5,  col: '#2bd9ff', f: valPleth, base: 0.86, amp: 0.58 },
  { h: 0.25, seg: 12, col: '#ffd21f', f: valResp,  base: 0.58, amp: 0.30 }
];
function tam() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  CW = cv.width = Math.round(cv.clientWidth * dpr);
  CH = cv.height = Math.round(cv.clientHeight * dpr);
  cx.fillStyle = '#000'; cx.fillRect(0, 0, CW, CH);
  var y = 0;
  bandas = DEF.map(function (d) {
    var b = { y0: Math.round(y * CH), h: Math.round(d.h * CH), vel: CW / d.seg, col: d.col, f: d.f, base: d.base, amp: d.amp, x: 0, py: null, acc: 0 };
    y += d.h; return b;
  });
}
window.addEventListener('resize', function () { setTimeout(tam, 150); });
tam();

function dibujarBanda(b, now, dt) {
  b.acc += dt / 1000 * b.vel;
  var n = Math.floor(b.acc); b.acc -= n;
  if (n > 400) n = 400;
  var hueco = Math.round(16 * dpr), lo = b.y0 + 2, hi = b.y0 + b.h - 2;
  cx.fillStyle = '#000';
  cx.beginPath();
  for (var i = 0; i < n; i++) {
    var t = now - (n - 1 - i) * 1000 / b.vel;
    cx.fillRect((b.x + hueco) % CW, b.y0, 1, b.h);
    var y = b.y0 + b.h * b.base - b.f(t) * b.h * b.amp;
    y = y < lo ? lo : (y > hi ? hi : y);
    if (b.x === 0) b.py = null;
    if (b.py !== null) { cx.moveTo(b.x - 1, b.py); cx.lineTo(b.x, y); }
    b.py = y; b.x = (b.x + 1) % CW;
  }
  cx.strokeStyle = b.col; cx.lineWidth = 2 * dpr; cx.lineCap = 'round'; cx.lineJoin = 'round';
  cx.stroke();
}

// ---------------- números, alarmas y reloj ----------------
var ultNums = 0;
function pintar(now) {
  var normal = st.modo === 'normal', dm = now - tModo;
  var taqui = normal && st.bpm >= 120;
  $('hrv').textContent = normal ? Math.round(st.bpm) : '---';
  $('thr').className = 't hr' + ((!normal || taqui) ? ' alto' : '');
  $('spv').textContent = (normal || dm < 4000) ? Math.round(Math.min(spo2, 100)) : '---';
  $('rsv').textContent = (normal || dm < 6000) ? Math.round(rr) : '---';
  $('tmv').textContent = temp.toFixed(1);
  if (pa) { $('pav').textContent = pa.s + '/' + pa.d; $('pam').textContent = '(' + pa.m + ')'; $('pah').textContent = pa.h; }
  var al = $('alarma');
  if (st.modo === 'plano')           { al.className = 'alta';  al.textContent = '*** ASISTOLIA ***'; }
  else if (st.modo === 'reviviendo') { al.className = 'info';  al.textContent = dm < T_CARGA ? 'CARGANDO 200 J' : 'DESCARGA 200 J'; }
  else if (taqui)                    { al.className = 'media'; al.textContent = '** TAQUICARDIA  HR > 120'; }
  else                               { al.className = '';      al.textContent = ''; }
  var vivo = enlace && now - tUltMsg < 3000;
  $('fuente').textContent = st.mf ? (vivo && st.real ? 'SENSOR' : 'SIM') : '';
  $('enlace').textContent = (st.mf && !vivo) ? 'SIN ENLACE' : '';
  $('estadoEnlace').textContent = vivo ? 'Monitor conectado' : 'Buscando monitor...';
  var d = new Date();
  $('reloj').textContent = hhmm(d) + ':' + ('0' + d.getSeconds()).slice(-2);
}

var tPrev = performance.now();
function cuadro(now) {
  var dt = Math.min(now - tPrev, 250); tPrev = now; ahora = now;
  simLocal(now);
  vitales(dt / 1000, now);
  for (var i = 0; i < bandas.length; i++) dibujarBanda(bandas[i], now, dt);
  if (now - ultNums > 200) { ultNums = now; pintar(now); }
  requestAnimationFrame(cuadro);
}
requestAnimationFrame(cuadro);

// ---------------- pantalla completa + sonido ----------------
function iniciar() {
if (!ac) {
  try {
    ac = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = ac.createGain();
    masterGain.gain.value = audioEnabled ? 1 : 0;
    masterGain.connect(ac.destination);
  } catch (e) {}
}

if (ac && ac.resume) ac.resume();
  var d = document.documentElement, rf = d.requestFullscreen || d.webkitRequestFullscreen;
  if (rf) {
    try {
      var p = rf.call(d);
      if (p && p.then) p.then(function () {
        try { screen.orientation.lock('landscape').catch(function () {}); } catch (e) {}
      }).catch(function () {});
    } catch (e) {}
  }
  $('inicio').style.display = 'none';
}
$('inicio').addEventListener('click', iniciar);

// Cache offline para la PWA.
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./service-worker.js').catch(function (e) {
      console.warn('No se pudo registrar el modo offline:', e);
    });
  });
}
document.addEventListener('fullscreenchange', function () {
  if (!document.fullscreenElement) $('inicio').style.display = 'flex';
});
</script>
</body></html>
